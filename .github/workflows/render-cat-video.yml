name: Render Cat TikTok Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnostics - environment
        run: |
          echo "=== Node ==="
          node --version
          echo "=== npm ==="
          npm --version
          echo "=== Repository ==="
          git rev-parse HEAD
          echo "=== Files ==="
          ls -la
          echo "=== Remotion files ==="
          ls -la remotion

      - name: Install dependencies
        run: |
          npm install
          echo "=== Installed packages ==="
          npm list --depth=0 || true

      - name: Diagnostics - Remotion composition
        run: |
          echo "=== package.json ==="
          cat package.json
          echo "=== index.jsx ==="
          cat remotion/index.jsx
          echo "=== HyperFramesDemo.jsx ==="
          cat remotion/HyperFramesDemo.jsx

      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render remotion/index.jsx HyperFramesDemo out/cat-tiktok-10s.mp4

      - name: Verify MP4
        run: |
          test -f out/cat-tiktok-10s.mp4
          echo "=== MP4 file ==="
          ls -lh out/cat-tiktok-10s.mp4
          echo "=== MP4 type ==="
          file out/cat-tiktok-10s.mp4
          echo "=== MP4 duration/stream info ==="
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/cat-tiktok-10s.mp4

      - name: Upload MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cat-tiktok-10s
          path: out/cat-tiktok-10s.mp4
          if-no-files-found: error
          retention-days: 7
