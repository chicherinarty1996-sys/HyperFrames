name: Render Cat TikTok Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npx remotion render remotion/index.jsx HyperFramesDemo out/cat-tiktok-10s.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: cat-tiktok-10s
          path: out/cat-tiktok-10s.mp4
