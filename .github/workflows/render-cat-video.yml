name: Render Cat TikTok Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render remotion/index.jsx HyperFramesDemo out/cat-tiktok-10s.mp4

      - name: Verify MP4
        run: |
          test -f out/cat-tiktok-10s.mp4
          ls -lh out/cat-tiktok-10s.mp4
          file out/cat-tiktok-10s.mp4
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/cat-tiktok-10s.mp4
          else
            echo "ffprobe unavailable; file/container verification passed."
          fi

      - name: Upload MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cat-tiktok-10s
          path: out/cat-tiktok-10s.mp4
          if-no-files-found: error
          retention-days: 7
