name: Render Rick and Morty TikTok MP4

on:
  push:
    branches: [main]
    paths:
      - "src/RickMortyMemes.jsx"
      - "remotion/index.jsx"
      - "package.json"
      - ".github/workflows/render-rick-morty.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rick-morty-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Remotion composition
        run: npx remotion compositions remotion/index.jsx

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render remotion/index.jsx RickMortyMemes out/rick-morty-memes.mp4 --codec=h264 --log=verbose
          test -s out/rick-morty-memes.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/rick-morty-memes.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rick-morty-memes
          path: out/rick-morty-memes.mp4
          if-no-files-found: error
          retention-days: 7
